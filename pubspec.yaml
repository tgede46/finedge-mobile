name: findge
description: FinEdge Africa — éducation financière mobile (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  go_router: ^16.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#F59A2E"
  adaptive_icon_foreground: assets/images/logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FDF8F3"
  image: assets/images/logo.png
  android: true
  ios: true
  android_12:
    color: "#FDF8F3"
    image: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
    - assets/avatars/
    - assets/images/
  # Police Matt (Fontfabric) — déposer Regular/Medium/Bold/Black ici :
